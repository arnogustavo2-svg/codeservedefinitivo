<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeCollab Pro</title>
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:Arial,sans-serif; background:#0a0a0a; color:#fff; height:100vh; width:100vw; overflow:hidden; position:fixed; top:0; left:0; }
        #loginPage { display:flex; align-items:center; justify-content:center; height:100%; background:#0a0a0a; }
        .login-box { background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:24px; width:90%; max-width:380px; }
        .login-box h1 { text-align:center; font-size:24px; margin-bottom:20px; }
        .login-box input { width:100%; padding:10px; margin:6px 0; background:#0a0a0a; border:1px solid #333; color:#fff; border-radius:6px; font-size:14px; }
        .login-box button { width:100%; padding:12px; margin:8px 0; border:none; border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer; }
        .btn-login { background:#fff; color:#000; }
        .btn-register { background:transparent; border:1px solid #555 !important; color:#fff; }
        .error { background:#400; color:#f66; padding:8px; border-radius:4px; font-size:12px; margin:8px 0; display:none; }
        #editorPage { display:none; height:100%; flex-direction:column; }
        .toolbar { display:flex; padding:8px; background:#1a1a1a; border-bottom:1px solid #333; gap:4px; flex-wrap:wrap; align-items:center; }
        .toolbar button, .toolbar select { padding:8px 12px; background:#0a0a0a; border:1px solid #333; color:#fff; border-radius:4px; cursor:pointer; font-size:12px; }
        .toolbar button:active { background:#333; }
        .run-btn { background:#0a5 !important; border-color:#0a5 !important; color:#fff !important; font-weight:bold; }
        .logout-btn { background:#a00 !important; border-color:#a00 !important; }
        .main-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        @media (min-width:768px) { .main-area { flex-direction:row; } }
        .panel { flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:200px; }
        .panel-header { padding:4px 10px; background:#1a1a1a; font-size:11px; color:#888; border-bottom:1px solid #333; }
        .panel-body { flex:1; overflow:hidden; }
        #codeEditor { width:100%; height:100%; background:#0d0d0d; color:#0f0; border:none; padding:10px; font-family:monospace; font-size:13px; resize:none; outline:none; }
        #console { background:#0d0d0d; color:#0f0; font-family:monospace; font-size:12px; padding:10px; height:100%; overflow-y:auto; white-space:pre-wrap; }
        #previewContainer { display:none; height:100%; }
        #previewFrame { width:100%; height:100%; border:none; background:#fff; }
        .splitter { width:100%; height:4px; background:#333; cursor:row-resize; }
        @media (min-width:768px) { .splitter { width:4px; height:auto; cursor:col-resize; } }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center; }
        .modal.show { display:flex; }
        .modal-content { background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:20px; width:90%; max-width:400px; max-height:80vh; overflow-y:auto; }
        .modal-content h3 { margin-bottom:12px; font-size:18px; }
        .modal-content button { width:100%; padding:10px; margin-top:10px; background:#333; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
        .toast { position:fixed; bottom:20px; right:20px; background:#fff; color:#000; padding:10px 16px; border-radius:8px; font-size:12px; font-family:monospace; z-index:200; }
        .loading { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:300; align-items:center; justify-content:center; }
        .loading.show { display:flex; }
        .spinner { width:30px; height:30px; border:3px solid #333; border-top:3px solid #888; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .checkbox-row { display:flex; align-items:center; gap:8px; margin:8px 0; font-size:12px; color:#999; }
        .checkbox-row input { width:16px; height:16px; }
        .link { color:#4af; text-decoration:underline; cursor:pointer; }
        .CodeMirror { height:100% !important; font-size:13px; }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-box">
        <h1>&#128640; CodeCollab Pro</h1>
        <p style="text-align:center;color:#888;font-size:11px;margin-bottom:16px;">Python, JavaScript, HTML, Java, C++ e mais</p>
        <input type="email" id="email" placeholder="Email" autocomplete="email">
        <input type="password" id="password" placeholder="Senha" autocomplete="current-password">
        <div id="roomGroup" style="display:none;">
            <input type="text" id="roomId" placeholder="ID da Sala">
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="joinRoomCheck">
            <span>Entrar em sala existente</span>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="lgpdCheck">
            <span>Aceito os <span class="link" id="termsLink">Termos</span> e <span class="link" id="lgpdLink">LGPD</span></span>
        </div>
        <div class="error" id="errorMsg"></div>
        <button class="btn-login" id="loginBtn">Entrar</button>
        <button class="btn-register" id="registerBtn">Criar Conta</button>
    </div>
</div>

<div id="editorPage">
    <div class="toolbar">
        <span style="font-weight:bold;color:#fff;margin-right:10px;">&#128640; CodeCollab</span>
        <span id="roomBadge" style="font-size:10px;color:#888;cursor:pointer;margin-right:10px;">Sala: ---</span>
        <select id="langSelect">
            <option value="html">&#127760; HTML</option>
            <option value="javascript">&#129000; JavaScript</option>
            <option value="python">&#128013; Python</option>
            <option value="java">&#9749; Java</option>
            <option value="cpp">&#9881;&#65039; C++</option>
            <option value="csharp">&#128302; C#</option>
        </select>
        <button class="run-btn" id="runBtn">&#9654; Run</button>
        <button id="downloadBtn">&#8675; Baixar</button>
        <button id="fullscreenBtn">&#9974; Tela Cheia</button>
        <button id="configBtn">&#9881;&#65039; Config</button>
        <button id="membersBtn">&#128101; Membros</button>
        <button class="logout-btn" id="logoutBtn">Sair</button>
    </div>
    <div class="main-area" id="mainArea">
        <div class="panel" id="editorPanel">
            <div class="panel-header">&#128221; Editor</div>
            <div class="panel-body">
                <textarea id="codeEditor"></textarea>
            </div>
        </div>
        <div class="splitter" id="splitter"></div>
        <div class="panel" id="outputPanel">
            <div class="panel-header">&#128187; Console / Preview</div>
            <div class="panel-body">
                <div id="console">// Clique Run ou pressione Ctrl+Enter para executar</div>
                <div id="previewContainer">
                    <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAIS -->
<div class="modal" id="configModal">
    <div class="modal-content">
        <h3>&#9881;&#65039; Configurações</h3>
        <div style="margin:8px 0;">
            <label>Tema:</label>
            <select id="themeSelect" style="width:100%;padding:8px;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:4px;margin-top:4px;">
                <option value="monokai">Monokai</option>
                <option value="default">Default</option>
            </select>
        </div>
        <div style="margin:8px 0;">
            <label>Fonte: <span id="fontSizeVal">14px</span></label>
            <input type="range" id="fontSizeSlider" min="10" max="24" value="14" style="width:100%;margin-top:4px;">
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="autosaveCheck" checked>
            <span>Auto-save</span>
        </div>
        <button id="closeConfigBtn">Fechar</button>
    </div>
</div>

<div class="modal" id="membersModal">
    <div class="modal-content">
        <h3>&#128101; Membros</h3>
        <div id="membersList" style="margin:8px 0;"></div>
        <button id="closeMembersBtn">Fechar</button>
    </div>
</div>

<div class="modal" id="legalModal">
    <div class="modal-content">
        <h3 id="legalTitle"></h3>
        <div id="legalContent" style="font-size:13px;color:#999;line-height:1.6;"></div>
        <button id="closeLegalBtn">Fechar</button>
    </div>
</div>

<div class="modal" id="fullscreenModal">
    <div style="position:fixed;inset:0;background:#000;z-index:150;display:flex;flex-direction:column;">
        <div style="padding:8px;background:#1a1a1a;display:flex;justify-content:space-between;">
            <span style="color:#888;">&#9654; Executando</span>
            <button id="closeFullscreenBtn" style="background:#a00;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">&#10005; Fechar</button>
        </div>
        <iframe id="fullscreenFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups" style="flex:1;border:none;background:#fff;"></iframe>
    </div>
</div>

<div class="loading" id="loadingOverlay">
    <div style="text-align:center;">
        <div class="spinner" style="margin:0 auto 14px;"></div>
        <span style="color:#888;" id="loadingMsg">Carregando...</span>
    </div>
</div>

<!-- SCRIPTS EXTERNOS -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

<script>
var auth, db;

var TEMPLATES = {
    html: '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="UTF-8">\n  <style>\n    body{font-family:sans-serif;padding:20px;background:#f5f5f5;}\n    h1{color:#333;}\n  </style>\n</head>\n<body>\n  <h1>Ola Mundo!</h1>\n  <p>Seu codigo HTML aqui.</p>\n</body>\n</html>',
    javascript: '// JavaScript\nconsole.log("Hello, World!");\n\nvar nome = "Dev";\nconsole.log("Bem-vindo, " + nome + "!");\n',
    python: '# Python 3\nprint("Hello, World!")\n\nnome = "Dev"\nprint("Bem-vindo, " + nome + "!")\n',
    java: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, World!");\n    }\n}\n',
    cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, World!" << endl;\n    return 0;\n}\n',
    csharp: 'using System;\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello, World!");\n    }\n}\n'
};

var APP = {
    user: null, roomId: null, isOwner: false, editor: null,
    currentLang: 'html', fontSize: 14, autoSave: true,
    unsubscribe: null, previewUrl: null, syncTimer: null,

    init: function() {
        var self = this;

        // Botões login
        document.getElementById('loginBtn').addEventListener('click', function() { self.login(); });
        document.getElementById('registerBtn').addEventListener('click', function() { self.register(); });

        // Botões toolbar
        document.getElementById('logoutBtn').addEventListener('click', function() { self.logout(); });
        document.getElementById('runBtn').addEventListener('click', function() { self.runCode(); });
        document.getElementById('downloadBtn').addEventListener('click', function() { self.download(); });
        document.getElementById('fullscreenBtn').addEventListener('click', function() { self.fullscreen(); });
        document.getElementById('configBtn').addEventListener('click', function() { document.getElementById('configModal').classList.add('show'); });
        document.getElementById('membersBtn').addEventListener('click', function() { self.showMembers(); });
        document.getElementById('roomBadge').addEventListener('click', function() { self.copyLink(); });

        // Fechar modais
        document.getElementById('closeConfigBtn').addEventListener('click', function() { document.getElementById('configModal').classList.remove('show'); });
        document.getElementById('closeMembersBtn').addEventListener('click', function() { document.getElementById('membersModal').classList.remove('show'); });
        document.getElementById('closeLegalBtn').addEventListener('click', function() { document.getElementById('legalModal').classList.remove('show'); });
        document.getElementById('closeFullscreenBtn').addEventListener('click', function() { document.getElementById('fullscreenModal').classList.remove('show'); });

        // Legal links
        document.getElementById('termsLink').addEventListener('click', function() { self.showLegal('terms'); });
        document.getElementById('lgpdLink').addEventListener('click', function() { self.showLegal('lgpd'); });

        // Checkbox sala
        document.getElementById('joinRoomCheck').addEventListener('change', function() {
            document.getElementById('roomGroup').style.display = this.checked ? 'block' : 'none';
        });

        // Linguagem
        document.getElementById('langSelect').addEventListener('change', function() {
            self.changeLanguage(this.value);
        });

        // Config
        document.getElementById('themeSelect').addEventListener('change', function() {
            if (self.editor) self.editor.setOption('theme', this.value);
        });
        document.getElementById('fontSizeSlider').addEventListener('input', function() {
            self.fontSize = parseInt(this.value);
            document.getElementById('fontSizeVal').textContent = self.fontSize + 'px';
            if (self.editor) {
                self.editor.getWrapperElement().style.fontSize = self.fontSize + 'px';
                self.editor.refresh();
            }
        });
        document.getElementById('autosaveCheck').addEventListener('change', function() {
            self.autoSave = this.checked;
        });

        // Teclado
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal.show').forEach(function(m) { m.classList.remove('show'); });
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                self.runCode();
            }
        });

        this.setupSplitter();

        auth.onAuthStateChanged(function(user) {
            if (user) {
                self.user = user;
                var params = new URLSearchParams(location.search);
                var room = params.get('room');
                if (room) { self.joinRoom(room); }
            }
        });
    },

    login: function() {
        document.getElementById('errorMsg').style.display = 'none';
        if (!document.getElementById('lgpdCheck').checked) { this.showError('Aceite os Termos e LGPD.'); return; }
        var email = document.getElementById('email').value.trim();
        var pass = document.getElementById('password').value;
        if (!email || !pass) { this.showError('Preencha todos os campos.'); return; }
        this.showLoading(true);
        var self = this;
        auth.signInWithEmailAndPassword(email, pass)
            .then(function(res) {
                self.user = res.user;
                if (document.getElementById('joinRoomCheck').checked && document.getElementById('roomId').value.trim()) {
                    return self.joinRoom(document.getElementById('roomId').value.trim());
                }
                return self.createRoom();
            })
            .then(function() { self.showLoading(false); })
            .catch(function(e) { self.showError(self.translateError(e)); self.showLoading(false); });
    },

    register: function() {
        document.getElementById('errorMsg').style.display = 'none';
        if (!document.getElementById('lgpdCheck').checked) { this.showError('Aceite os Termos e LGPD.'); return; }
        var email = document.getElementById('email').value.trim();
        var pass = document.getElementById('password').value;
        if (!email || !pass) { this.showError('Preencha todos os campos.'); return; }
        if (pass.length < 6) { this.showError('Senha: minimo 6 caracteres.'); return; }
        this.showLoading(true);
        var self = this;
        auth.createUserWithEmailAndPassword(email, pass)
            .then(function(res) { self.user = res.user; return self.createRoom(); })
            .then(function() { self.showLoading(false); })
            .catch(function(e) { self.showError(self.translateError(e)); self.showLoading(false); });
    },

    logout: function() {
        var self = this;
        if (this.unsubscribe) { this.unsubscribe(); this.unsubscribe = null; }
        if (this.editor) { this.editor.toTextArea(); this.editor = null; }
        auth.signOut().then(function() {
            self.user = null; self.roomId = null; self.isOwner = false;
            history.pushState({}, '', location.pathname);
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('editorPage').style.display = 'none';
        });
    },

    createRoom: function() {
        var self = this;
        return db.collection('rooms').add({
            ownerId: this.user.uid,
            ownerEmail: this.user.email,
            members: [this.user.uid],
            memberEmails: {},
            code: TEMPLATES[this.currentLang],
            language: this.currentLang,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function(doc) {
            self.roomId = doc.id;
            self.isOwner = true;
            history.pushState({}, '', '?room=' + doc.id);
            self.showEditor();
            self.toast('Sala criada!');
        }).catch(function() { self.showError('Erro ao criar sala.'); });
    },

    joinRoom: function(id) {
        var self = this;
        return db.collection('rooms').doc(id).get().then(function(doc) {
            if (!doc.exists) { self.showError('Sala nao encontrada.'); return; }
            var data = doc.data();
            var update = { members: firebase.firestore.FieldValue.arrayUnion(self.user.uid) };
            update['memberEmails.' + self.user.uid] = self.user.email;
            return db.collection('rooms').doc(id).update(update).then(function() {
                self.roomId = id;
                self.isOwner = data.ownerId === self.user.uid;
                if (data.language) {
                    self.currentLang = data.language;
                    document.getElementById('langSelect').value = da
