<script>
firebase.initializeApp({apiKey:"AIzaSyBXTrBywgR85BYs_7XRjf-N6leLTRTegis",authDomain:"codeverse-14794.firebaseapp.com",projectId:"codeverse-14794",storageBucket:"codeverse-14794.firebasestorage.app",messagingSenderId:"307083349125",appId:"1:307083349125:web:11b96a4c3fd856d6236dec"});

function tc(b,i){var x=document.getElementById(b),y=document.getElementById(i);y.checked=!y.checked;if(y.checked){x.classList.add('on');x.textContent='✓'}else{x.classList.remove('on');x.textContent=''}if(y.onchange)y.onchange()}

init:function(){document.getElementById('loginPage').style.display='flex';document.getElementById('editorPage').style.display='none';var s=this;

login:function(){if(!document.getElementById('lgpdCheck').checked){this.showError('Aceite os Termos e LGPD.');return}var email=document.getElementById('email').value.trim(),pass=document.getElementById('password').value;if(!email||!pass){this.showError('Preencha os campos.');return}this.showLoading(true);var s=this;auth.signInWithEmailAndPassword(email,pass).then(function(r){s.user=r.user;var roomVal=(document.getElementById('roomId').value||'').trim();var joinChecked=document.getElementById('joinRoomCheck').checked;if(joinChecked&&roomVal){return s.joinRoom(roomVal)}return s.createRoom()}).catch(function(e){s.showError(s.translateError(e));s.showLoading(false)})},
register:function(){if(!document.getElementById('lgpdCheck').checked){this.showError('Aceite os Termos e LGPD.');return}var email=document.getElementById('email').value.trim(),pass=document.getElementById('password').value;if(!email||!pass){this.showError('Preencha os campos.');return}if(pass.length<6){this.showError('Senha: mínimo 6 caracteres.');return}this.showLoading(true);var s=this;auth.createUserWithEmailAndPassword(email,pass).then(function(r){s.user=r.user;return s.createRoom()}).catch(function(e){s.showError(s.translateError(e));s.showLoading(false)})},
logout:function(){var s=this;if(this.unsub){this.unsub();this.unsub=null}if(this.previewUrl){URL.revokeObjectURL(this.previewUrl);this.previewUrl=null}if(this.offlineMode){s.user=null;s.roomId=null;s.offlineMode=false;document.getElementById('loginPage').style.display='flex';document.getElementById('editorPage').style.display='none';return}this.showLoading(true);auth.signOut().then(function(){s.user=null;s.roomId=null;s.isOwner=false;history.pushState({},'',location.pathname);document.getElementById('loginPage').style.display='flex';document.getElementById('editorPage').style.display='none';s.showLoading(false)})},

joinRoom:function(id){var s=this;return db.collection('rooms').doc(id).get().then(function(doc){if(!doc.exists){s.showError('Sala não encontrada.');s.showLoading(false);throw new Error('x')}var x=doc.data();if(x.members.includes(s.user.uid)){return x}var u={members:firebase.firestore.FieldValue.arrayUnion(s.user.uid)};u['memberEmails.'+s.user.uid]=s.user.email;return db.collection('rooms').doc(id).update(u).then(function(){return db.collection('rooms').doc(id).get()}).then(function(freshDoc){return freshDoc.data()})}).then(function(x){if(!x)return;s.roomId=id;s.isOwner=x.ownerId===s.user.uid;if(x.language){s.lang=x.language;document.getElementById('langSelect').value=x.language}document.getElementById('codeEditor').value=x.code||'';if(s.lang==='html')s.updatePreview(x.code||'');history.pushState({},'','?room='+id);s.showEditor();s.toast('✅ Entrou na sala!');s.showLoading(false)}).catch(function(e){if(e.message!=='x'){s.showError('Erro ao entrar.');s.showLoading(false)}})},
showEditor:function(){document.getElementById('loginPage').style.display='none';document.getElementById('editorPage').style.display='flex';document.getElementById('roomBadge').textContent=this.offlineMode?'Offline':'Sala: '+(this.roomId?this.roomId.substring(0,10)+'...':'---');if(!this.offlineMode&&this.roomId)this.listenRoom()},
listenRoom:function(){var s=this;if(this.unsub)this.unsub();this.unsub=db.collection('rooms').doc(this.roomId).onSnapshot(function(doc){if(!doc.exists){s.logout();return}var x=doc.data();if(!x.members.includes(s.user.uid)){alert('Removido.');s.logout();return}if(!s.editorFocused&&x.code!==document.getElementById('codeEditor').value){document.getElementById('codeEditor').value=x.code||'';if(s.lang==='html')s.updatePreview(x.code||'')}if(x.language&&x.language!==s.lang){s.lang=x.language;document.getElementById('langSelect').value=x.language;s.changeLang(x.language)}})},

showMembers:function(){if(!this.roomId){this.toast('Faça login primeiro');return}if(this.offlineMode){this.toast('Indisponível offline');return}var s=this;db.collection('rooms').doc(this.roomId).get().then(function(doc){var x=doc.data(),l=document.getElementById('membersList');l.innerHTML='';var oe=document.createElement('div');oe.className='member-item';oe.innerHTML='<span>👑 <b>'+x.ownerEmail+'</b></span><span style="color:#666;font-size:10px">DONO</span>';l.appendChild(oe);var me=x.memberEmails||{};x.members.forEach(function(uid){if(uid!==x.ownerId){var de=document.createElement('div');de.className='member-item';de.innerHTML='<span>👤 '+(me[uid]||uid.substring(0,8)+'...')+'</span>'+(s.isOwner?'<button class="remove-btn" onclick="APP.removeMember(\''+uid+'\')">Remover</button>':'');l.appendChild(de)}});if(x.members.length<=1){var emp=document.createElement('p');emp.style.cssText='color:#666;font-size:11px;text-align:center;padding:10px';emp.textContent='Nenhum outro membro';l.appendChild(emp)}document.getElementById('membersModal').classList.add('show')}).catch(function(){APP.toast('Erro ao carregar')})},
removeMember:function(uid){if(!this.isOwner||!confirm('Remover este membro?'))return;var s=this,u={members:firebase.firestore.FieldValue.arrayRemove(uid)};u['memberEmails.'+uid]=firebase.firestore.FieldValue.delete();db.collection('rooms').doc(this.roomId).update(u).then(function(){s.toast('✅ Removido!');s.showMembers()})},
showLegal:function(t){var x=document.getElementById('legalTitle'),y=document.getElementById('legalContent');if(t==='terms'){x.textContent='Termos';y.innerHTML='<p>1. Ao usar, concorda.</p>'}else{x.textContent='LGPD';y.innerHTML='<p>1. Dados protegidos.</p>'}document.getElementById('legalModal').classList.add('show')},
setupSplitter:function(){var sp=document.getElementById('splitter'),ep=document.getElementById('editorPanel'),op=document.getElementById('outputPanel'),ma=document.getElementById('mainArea'),dr=false;sp.addEventListener('mousedown',function(){dr=true});sp.addEventListener('touchstart',function(){dr=true},{passive:true});document.addEventListener('mousemove',function(e){if(!dr)return;var r=ma.getBoundingClientRect();if(window.innerWidth<768){var v=Math.max(15,Math.min(85,((e.clientY-r.top)/r.height)*100));ep.style.flex='none';ep.style.height=v+'%';op.style.flex='none';op.style.height=(100-v)+'%'}else{var v=Math.max(15,Math.min(85,((e.clientX-r.left)/r.width)*100));ep.style.flex='none';ep.style.width=v+'%';op.style.flex='none';op.style.width=(100-v)+'%'}});document.addEventListener('touchmove',function(e){if(!dr)return;var r=ma.getBoundingClientRect(),v=Math.max(15,Math.min(85,((e.touches[0].clientY-r.top)/r.height)*100));ep.style.flex='none';ep.style.height=v+'%';op.style.flex='none';op.style.height=(100-v)+'%'},{passive:true});document.addEventListener('mouseup',function(){dr=false});document.addEventListener('touchend',function(){dr=false})},
showError:function(m){var e=document.getElementById('errorMsg');e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none'},4000)},
toast:function(m){var x=document.querySelector('.toast');if(x)x.remove();var e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(function(){if(e.parentNode)e.remove()},300)},2000)},
showLoading:function(s){document.getElementById('loadingOverlay').classList.toggle('show',s)},
translateError:function(e){var m={'auth/email-already-in-use':'Email já cadastrado.','auth/invalid-email':'Email inválido.','auth/weak-password':'Senha fraca.','auth/user-not-found':'Usuário não encontrado.','auth/wrong-password':'Senha incorreta.','auth/too-many-requests':'Muitas tentativas.','auth/network-request-failed':'Sem conexão.'};return m[e.code]||e.message}};
window.APP=APP;APP.init();
</script>
</body>
</html>
