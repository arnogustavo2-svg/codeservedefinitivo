<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CodeCollab Pro</title>
    <meta name="theme-color" content="#0a0a0a">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:#0a0a0a;color:#e0e0e0;
            height:100vh;height:100dvh;width:100vw;
            overflow:hidden;position:fixed;top:0;left:0;
            -webkit-font-smoothing:antialiased;
        }
        #loginPage{
            display:flex;align-items:center;justify-content:center;
            height:100%;width:100%;background:#0a0a0a;padding:16px;
        }
        .login-card{
            background:#1a1a1a;border:1px solid #333;border-radius:12px;
            padding:24px;width:100%;max-width:400px;
        }
        .login-card h1{text-align:center;font-size:22px;font-weight:700;color:#fff;margin-bottom:16px}
        .login-card input{
            width:100%;padding:12px;margin:6px 0;
            background:#0a0a0a;border:1px solid #333;color:#fff;
            border-radius:8px;font-size:16px;outline:none;
            -webkit-appearance:none;
        }
        .login-card input:focus{border-color:#4a90d9}
        .login-card button{
            width:100%;padding:14px;margin:8px 0;border:none;
            border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;
            -webkit-appearance:none;
        }
        .btn-login{background:#fff;color:#000}
        .btn-register{background:transparent;border:1px solid #555;color:#ccc}
        .error-msg{
            background:#400;color:#f66;padding:10px;border-radius:6px;
            font-size:13px;text-align:center;margin:8px 0;display:none;
        }
        #editorPage{display:none;height:100%;width:100%;flex-direction:column}
        .toolbar{
            display:flex;align-items:center;justify-content:space-between;
            padding:8px;background:#1a1a1a;border-bottom:1px solid #333;
            flex-shrink:0;flex-wrap:wrap;gap:6px;min-height:44px;
        }
        .toolbar button,.toolbar select{
            padding:8px 12px;background:#0a0a0a;border:1px solid #333;
            color:#fff;border-radius:6px;cursor:pointer;font-size:13px;
            -webkit-appearance:none;min-height:36px;
        }
        .toolbar button:active{background:#333}
        .toolbar .run-btn{background:#0a5;border-color:#0a5;font-weight:bold}
        .toolbar .logout-btn{background:#a00;border-color:#a00}
        .main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
        @media(min-width:768px){.main-area{flex-direction:row}}
        .panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:150px}
        .panel-header{
            padding:6px 10px;background:#1a1a1a;border-bottom:1px solid #333;
            font-size:12px;color:#888;flex-shrink:0;
        }
        .panel-body{flex:1;overflow:hidden}
        #codeEditor{
            width:100%;height:100%;background:#0d0d0d;color:#0f0;
            border:none;padding:12px;font-family:monospace;
            font-size:14px;resize:none;outline:none;
            -webkit-appearance:none;
        }
        #console{
            background:#0d0d0d;color:#0f0;font-family:monospace;
            font-size:13px;padding:12px;height:100%;overflow-y:auto;
            -webkit-overflow-scrolling:touch;white-space:pre-wrap;
        }
        #console.error{color:#f44}
        #previewContainer{display:none;height:100%;width:100%;background:#fff}
        #previewFrame{width:100%;height:100%;border:none;background:#fff}
        .splitter{
            width:100%;height:6px;background:#333;cursor:row-resize;
            flex-shrink:0;touch-action:none;
        }
        .splitter:active{background:#4a90d9}
        @media(min-width:768px){.splitter{width:6px;height:auto;cursor:col-resize}}
        .modal{
            display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
            z-index:100;align-items:center;justify-content:center;padding:16px;
        }
        .modal.show{display:flex}
        .modal-content{
            background:#1a1a1a;border:1px solid #333;border-radius:12px;
            padding:20px;width:100%;max-width:400px;max-height:80vh;
            overflow-y:auto;-webkit-overflow-scrolling:touch;
        }
        .modal-content h3{color:#fff;font-size:18px;margin-bottom:12px}
        .modal-content button{
            width:100%;padding:12px;margin-top:8px;background:#333;
            color:#fff;border:none;border-radius:8px;cursor:pointer;
            font-size:15px;-webkit-appearance:none;min-height:44px;
        }
        .toast{
            position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
            background:#fff;color:#000;padding:10px 18px;border-radius:20px;
            font-size:13px;z-index:200;white-space:nowrap;
            box-shadow:0 10px 30px rgba(0,0,0,.5);
            animation:toastIn .3s ease;
        }
        @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .loading{
            display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
            z-index:300;align-items:center;justify-content:center;
        }
        .loading.show{display:flex}
        .spinner{
            width:36px;height:36px;border:3px solid #333;
            border-top:3px solid #ccc;border-radius:50%;
            animation:spin .8s linear infinite;margin:0 auto 12px;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        .checkbox-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;color:#999}
        .checkbox-row input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:#4a90d9}
        .link{color:#4af;text-decoration:underline;cursor:pointer}
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-card">
        <h1>🚀 CodeCollab Pro</h1>
        <input type="email" id="email" placeholder="Email" autocomplete="email" inputmode="email">
        <input type="password" id="password" placeholder="Senha" autocomplete="current-password">
        <div id="roomGroup" style="display:none"><input type="text" id="roomId" placeholder="ID da Sala"></div>
        <div class="checkbox-row"><input type="checkbox" id="joinRoomCheck"><span>Entrar em sala existente</span></div>
        <div class="checkbox-row"><input type="checkbox" id="lgpdCheck"><span>Aceito os <span class="link" id="termsLink">Termos</span> e <span class="link" id="lgpdLink">LGPD</span></span></div>
        <div class="error-msg" id="errorMsg"></div>
        <button class="btn-login" id="loginBtn">Entrar</button>
        <button class="btn-register" id="registerBtn">Criar Conta</button>
    </div>
</div>

<div id="editorPage">
    <div class="toolbar">
        <span style="font-weight:bold;color:#fff;font-size:14px">🚀 CC</span>
        <span id="roomBadge" style="font-size:10px;color:#888;cursor:pointer;background:#111;padding:4px 6px;border-radius:4px">Sala: ---</span>
        <select id="langSelect"><option value="html">HTML</option><option value="javascript">JS</option><option value="python">PY</option></select>
        <button class="run-btn" id="runBtn">▶ Run</button>
        <button id="downloadBtn">⬇</button>
        <button id="fullscreenBtn">⛶</button>
        <button id="configBtn">⚙</button>
        <button id="membersBtn">👥</button>
        <button class="logout-btn" id="logoutBtn">✕</button>
    </div>
    <div class="main-area" id="mainArea">
        <div class="panel" id="editorPanel">
            <div class="panel-header">📝 Editor</div>
            <div class="panel-body"><textarea id="codeEditor" placeholder="Digite seu código aqui..."></textarea></div>
        </div>
        <div class="splitter" id="splitter"></div>
        <div class="panel" id="outputPanel">
            <div class="panel-header">💻 Console / Preview</div>
            <div class="panel-body">
                <div id="console">// ▶ Run ou Ctrl+Enter</div>
                <div id="previewContainer"><iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe></div>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="configModal"><div class="modal-content"><h3>⚙️ Config</h3><div style="margin:8px 0"><label>Tema</label><select id="themeSelect" style="width:100%;padding:8px;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:4px;margin-top:4px"><option value="dark">Escuro</option><option value="light">Claro</option></select></div><div style="margin:8px 0"><label>Fonte: <span id="fontSizeVal">14px</span></label><input type="range" id="fontSizeSlider" min="12" max="20" value="14" style="width:100%;margin-top:4px"></div><button id="closeConfigBtn">Fechar</button></div></div>
<div class="modal" id="membersModal"><div class="modal-content"><h3>👥 Membros</h3><div id="membersList" style="margin:8px 0"></div><button id="closeMembersBtn">Fechar</button></div></div>
<div class="modal" id="legalModal"><div class="modal-content"><h3 id="legalTitle"></h3><div id="legalContent" style="font-size:13px;color:#999;line-height:1.6"></div><button id="closeLegalBtn">Fechar</button></div></div>
<div class="modal" id="fullscreenModal"><div style="position:fixed;inset:0;background:#000;z-index:150;display:flex;flex-direction:column"><div style="padding:8px 12px;background:#1a1a1a;display:flex;justify-content:space-between;align-items:center"><span style="color:#888">▶ Preview</span><button id="closeFullscreenBtn" style="background:#a00;color:#fff;border:none;padding:8px 14px;border-radius:4px;cursor:pointer;font-size:13px">✕ Fechar</button></div><iframe id="fullscreenFrame" sandbox="allow-scripts allow-same-origin" style="flex:1;border:none;background:#fff"></iframe></div></div>
<div class="loading" id="loadingOverlay"><div style="text-align:center"><div class="spinner"></div><span style="color:#ccc;font-size:14px">Carregando...</span></div></div>

<script>
// Firebase
firebase.initializeApp({apiKey:"AIzaSyBXTrBywgR85BYs_7XRjf-N6leLTRTegis",authDomain:"codeverse-14794.firebaseapp.com",projectId:"codeverse-14794",storageBucket:"codeverse-14794.firebasestorage.app",messagingSenderId:"307083349125",appId:"1:307083349125:web:11b96a4c3fd856d6236dec"});
var auth=firebase.auth(),db=firebase.firestore();
var TMPL={html:'<!DOCTYPE html>\n<html>\n<head><meta charset="UTF-8"><style>body{font-family:sans-serif;padding:20px;background:#f5f5f5}h1{color:#333}</style></head>\n<body><h1>🚀 Olá!</h1><p>Seu código HTML aqui.</p></body>\n</html>',javascript:'// JavaScript\nconsole.log("Hello!");\n',python:'# Python\nprint("Hello!")\n'};

var APP={
    user:null,roomId:null,isOwner:false,currentLang:'html',fontSize:14,autoSave:true,
    unsubscribe:null,previewUrl:null,syncTimer:null,

    init:function(){
        document.getElementById('loginPage').style.display='flex';
        document.getElementById('editorPage').style.display='none';
        var s=this;
        document.getElementById('loginBtn').onclick=function(){s.login();};
        document.getElementById('registerBtn').onclick=function(){s.register();};
        document.getElementById('logoutBtn').onclick=function(){s.logout();};
        document.getElementById('runBtn').onclick=function(){s.runCode();};
        document.getElementById('downloadBtn').onclick=function(){s.download();};
        document.getElementById('fullscreenBtn').onclick=function(){s.fullscreen();};
        document.getElementById('configBtn').onclick=function(){document.getElementById('configModal').classList.add('show');};
        document.getElementById('membersBtn').onclick=function(){s.showMembers();};
        document.getElementById('roomBadge').onclick=function(){s.copyLink();};
        document.getElementById('closeConfigBtn').onclick=function(){document.getElementById('configModal').classList.remove('show');};
        document.getElementById('closeMembersBtn').onclick=function(){document.getElementById('membersModal').classList.remove('show');};
        document.getElementById('closeLegalBtn').onclick=function(){document.getElementById('legalModal').classList.remove('show');};
        document.getElementById('closeFullscreenBtn').onclick=function(){document.getElementById('fullscreenModal').classList.remove('show');};
        document.getElementById('termsLink').onclick=function(e){e.stopPropagation();s.showLegal('terms');};
        document.getElementById('lgpdLink').onclick=function(e){e.stopPropagation();s.showLegal('lgpd');};
        document.getElementById('joinRoomCheck').onchange=function(){document.getElementById('roomGroup').style.display=this.checked?'block':'none';};
        document.getElementById('langSelect').onchange=function(){s.changeLanguage(this.value);};
        document.getElementById('themeSelect').onchange=function(){var ta=document.getElementById('codeEditor');if(this.value==='light'){ta.style.background='#fff';ta.style.color='#000';}else{ta.style.background='#0d0d0d';ta.style.color='#0f0';}};
        document.getElementById('fontSizeSlider').oninput=function(){s.fontSize=parseInt(this.value);document.getElementById('fontSizeVal').textContent=s.fontSize+'px';document.getElementById('codeEditor').style.fontSize=s.fontSize+'px';};
        document.querySelectorAll('.modal').forEach(function(m){m.onclick=function(e){if(e.target===m)m.classList.remove('show');};});
        document.onkeydown=function(e){if(e.key==='Escape')document.querySelectorAll('.modal.show').forEach(function(m){m.classList.remove('show');});if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();s.runCode();}};
        this.setupSplitter();
        auth.onAuthStateChanged(function(user){if(user){s.user=user;var p=new URLSearchParams(location.search);var r=p.get('room');if(r)s.joinRoom(r);}});
        // ESCONDER LOADING após 3 segundos
        setTimeout(function(){document.getElementById('loadingOverlay').classList.remove('show');},3000);
    },

    login:function(){if(!document.getElementById('lgpdCheck').checked){this.showError('Aceite os Termos e LGPD.');return;}var email=document.getElementById('email').value.trim(),pass=document.getElementById('password').value;if(!email||!pass){this.showError('Preencha os campos.');return;}this.showLoading(true);var s=this;auth.signInWithEmailAndPassword(email,pass).then(function(r){s.user=r.user;if(document.getElementById('joinRoomCheck').checked&&document.getElementById('roomId').value.trim())return s.joinRoom(document.getElementById('roomId').value.trim());return s.createRoom();}).catch(function(e){s.showError(s.translateError(e));}).finally(function(){s.showLoading(false);});},
    register:function(){if(!document.getElementById('lgpdCheck').checked){this.showError('Aceite os Termos e LGPD.');return;}var email=document.getElementById('email').value.trim(),pass=document.getElementById('password').value;if(!email||!pass){this.showError('Preencha os campos.');return;}if(pass.length<6){this.showError('Senha: mínimo 6 caracteres.');return;}this.showLoading(true);var s=this;auth.createUserWithEmailAndPassword(email,pass).then(function(r){s.user=r.user;return s.createRoom();}).catch(function(e){s.showError(s.translateError(e));}).finally(function(){s.showLoading(false);});},
    logout:function(){this.showLoading(true);var s=this;if(this.unsubscribe){this.unsubscribe();this.unsubscribe=null;}if(this.previewUrl){URL.revokeObjectURL(this.previewUrl);this.previewUrl=null;}auth.signOut().then(function(){s.user=null;s.roomId=null;s.isOwner=false;history.pushState({},'',location.pathname);document.getElementById('loginPage').style.display='flex';document.getElementById('editorPage').style.display='none';document.getElementById('email').value='';document.getElementById('password').value='';s.showLoading(false);});},
    createRoom:function(){var s=this;return db.collection('rooms').add({ownerId:this.user.uid,ownerEmail:this.user.email,members:[this.user.uid],memberEmails:{},code:TMPL[this.currentLang]||'',language:this.currentLang,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(doc){s.roomId=doc.id;s.isOwner=true;history.pushState({},'','?room='+doc.id);s.showEditor();s.toast('Sala criada!');}).catch(function(){s.showError('Erro ao criar sala.');});},
    joinRoom:function(id){var s=this;return db.collection('rooms').doc(id).get().then(function(doc){if(!doc.exists){s.showError('Sala não encontrada.');throw new Error('nf');}var d=doc.data();if(!d.members.includes(s.user.uid)){var u={members:firebase.firestore.FieldValue.arrayUnion(s.user.uid)};u['memberEmails.'+s.user.uid]=s.user.email;return db.collection('rooms').doc(id).update(u).then(function(){return d;});}return d;}).then(function(d){if(!d)return;s.roomId=id;s.isOwner=d.ownerId===s.user.uid;if(d.language){s.currentLang=d.language;document.getElementById('langSelect').value=d.language;}history.pushState({},'','?room='+id);s.showEditor();s.toast('Entrou!');}).catch(function(e){if(e.message!=='nf')s.showError('Erro.');});},
    showEditor:function(){document.getElementById('loginPage').style.display='none';document.getElementById('editorPage').style.display='flex';document.getElementById('roomBadge').textContent='Sala: '+(this.roomId?this.roomId.substring(0,10)+'...':'---');if(this.roomId)this.listenRoom();},
    listenRoom:function(){var s=this;if(this.unsubscribe)this.unsubscribe();this.unsubscribe=db.collection('rooms').doc(this.roomId).onSnapshot(function(doc){if(!doc.exists){s.logout();return;}var d=doc.data();if(!d.members.includes(s.user.uid)){alert('Acesso revogado.');s.logout();return;}if(d.code!==document.getElementById('codeEditor').value){document.getElementById('codeEditor').value=d.code||'';}if(d.language&&d.language!==s.currentLang){s.currentLang=d.language;document.getElementById('langSelect').value=d.language;s.changeLanguage(d.language);}});},
    syncCode:function(){if(!this.roomId)return;var code=document.getElementById('codeEditor').value;db.collection('rooms').doc(this.roomId).update({code:code,language:this.currentLang}).catch(function(){});},
    changeLanguage:function(lang){this.currentLang=lang;if(lang==='html'){document.getElementById('previewContainer').style.display='block';document.getElementById('console').style.display='none';}else{document.getElementById('previewContainer').style.display='none';document.getElementById('console').style.display='block';}this.toast(lang.toUpperCase());},
    updatePreview:function(code){if(this.previewUrl)URL.revokeObjectURL(this.previewUrl);this.previewUrl=URL.createObjectURL(new Blob([code],{type:'text/html'}));document.getElementById('previewFrame').src=this.previewUrl;},
    runCode:function(){var code=document.getElementById('codeEditor').value;if(this.currentLang==='html'){this.updatePreview(code);document.getElementById('previewContainer').style.display='block';document.getElementById('console').style.display='none';return;}document.getElementById('console').style.display='block';document.getElementById('previewContainer').style.display='none';var c=document.getElementById('console');c.className='';c.textContent='Executando...\n';if(this.currentLang==='javascript'){try{var out='';var ol=console.log;console.log=function(){for(var i=0;i<arguments.length;i++)out+=arguments[i]+' ';out+='\n';};eval(code);console.log=ol;c.textContent=out||'OK';}catch(e){c.textContent='Erro: '+e.message;c.className='error';}}else{c.textContent='Use HTML ou JavaScript.';c.className='warn';}},
    download:function(){var e={html:'.html',javascript:'.js',python:'.py'};var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([document.getElementById('codeEditor').value],{type:'text/plain'}));a.download='projeto'+(e[this.currentLang]||'.txt');a.click();this.toast('Baixado!');},
    fullscreen:function(){var b=new Blob([document.getElementById('codeEditor').value],{type:'text/html'});document.getElementById('fullscreenFrame').src=URL.createObjectURL(b);document.getElementById('fullscreenModal').classList.add('show');},
    copyLink:function(){if(!this.roomId)return;var url=location.origin+location.pathname+'?room='+this.roomId;if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){APP.toast('Copiado!');});}else{var t=document.createElement('textarea');t.value=url;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);APP.toast('Copiado!');}},
    showMembers:function(){if(!this.roomId)return;var s=this;db.collection('rooms').doc(this.roomId).get().then(function(doc){var d=doc.data(),list=document.getElementById('membersList');list.innerHTML='';var od=document.createElement('div');od.style.cssText='padding:8px;background:#222;border-radius:4px;margin:4px 0;font-size:13px';od.innerHTML='👑 <b>'+d.ownerEmail+'</b> (Dono)';list.appendChild(od);var me=d.memberEmails||{};d.members.forEach(function(uid){if(uid!==d.ownerId){var dd=document.createElement('div');dd.style.cssText='padding:8px;background:#111;border-radius:4px;margin:4px 0;font-size:13px;display:flex;justify-content:space-between';dd.innerHTML='<span>👤 '+(me[uid]||uid.substring(0,8)+'...')+'</span>'+(s.isOwner?'<button onclick="APP.removeMember(\''+uid+'\')" style="background:#a00;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer">Remover</button>':'');list.appendChild(dd);}});document.getElementById('membersModal').classList.add('show');});},
    removeMember:function(uid){if(!this.isOwner||!confirm('Remover?'))return;var s=this,u={members:firebase.firestore.FieldValue.arrayRemove(uid)};u['memberEmails.'+uid]=firebase.firestore.FieldValue.delete();db.collection('rooms').doc(this.roomId).update(u).then(function(){s.toast('Removido!');s.showMembers();});},
    showLegal:function(type){var t=document.getElementById('legalTitle'),c=document.getElementById('legalContent');if(type==='terms'){t.textContent='Termos de Uso';c.innerHTML='<p><b style="color:#fff">1.</b> Ao usar, concorda.</p><p style="margin-top:8px"><b style="color:#fff">2.</b> Suporte HTML, JS e Python.</p>';}else{t.textContent='LGPD';c.innerHTML='<p><b style="color:#fff">1.</b> Coletamos email e código.</p><p style="margin-top:8px"><b style="color:#fff">2.</b> Dados protegidos.</p>';}document.getElementById('legalModal').classList.add('show');},
    setupSplitter:function(){var sp=document.getElementById('splitter'),ep=document.getElementById('editorPanel'),op=document.getElementById('outputPanel'),ma=document.getElementById('mainArea'),dragging=false;function im(){return window.innerWidth<768;}sp.addEventListener('mousedown',function(){dragging=true;});sp.addEventListener('touchstart',function(){dragging=true;},{passive:true});document.addEventListener('mousemove',function(e){if(!dragging)return;var r=ma.getBoundingClientRect();if(im()){var v=Math.max(15,Math.min(85,((e.clientY-r.top)/r.height)*100));ep.style.flex='none';ep.style.height=v+'%';op.style.flex='none';op.style.height=(100-v)+'%';}else{var v=Math.max(15,Math.min(85,((e.clientX-r.left)/r.width)*100));ep.style.flex='none';ep.style.width=v+'%';op.style.flex='none';op.style.width=(100-v)+'%';}});document.addEventListener('touchmove',function(e){if(!dragging)return;var r=ma.getBoundingClientRect(),v=Math.max(15,Math.min(85,((e.touches[0].clientY-r.top)/r.height)*100));ep.style.flex='none';ep.style.height=v+'%';op.style.flex='none';op.style.height=(100-v)+'%';},{passive:true});document.addEventListener('mouseup',function(){dragging=false;});document.addEventListener('touchend',function(){dragging=false;});},
    showError:function(msg){var e=document.getElementById('errorMsg');e.textContent=msg;e.style.display='block';setTimeout(function(){e.style.display='none';},4000);},
    toast:function(msg){var x=document.querySelector('.toast');if(x)x.remove();var e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(function(){if(e.parentNode)e.remove();},300);},2000);},
    showLoading:function(s){document.getElementById('loadingOverlay').classList.toggle('show',s);},
    translateError:function(e){var m={'auth/email-already-in-use':'Email já cadastrado.','auth/invalid-email':'Email inválido.','auth/weak-password':'Senha fraca (mín. 6).','auth/user-not-found':'Usuário não encontrado.','auth/wrong-password':'Senha incorreta.','auth/too-many-requests':'Muitas tentativas.','auth/network-request-failed':'Sem conexão.','auth/operation-not-allowed':'Login desabilitado.'};return m[e.code]||e.message;}
};

window.APP=APP;
APP.init();
</script>
</body>
