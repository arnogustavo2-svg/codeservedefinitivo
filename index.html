.btn-login{background:#fff;color:#000}
.btn-register{background:transparent;border:1px solid #555;color:#ccc}
.btn-skip{background:transparent;border:1px solid #4a90d9;color:#4a90d9;padding:12px;border-radius:8px;font-size:14px;cursor:pointer;width:100%;max-width:380px;text-align:center}
.error-msg{background:#400;color:#f66;padding:10px;border-radius:6px;font-size:13px;text-align:center;margin:6px 0;display:none}
#editorPage{display:none;height:100%;flex-direction:column}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:#1a1a1a;border-bottom:1px solid #333;flex-shrink:0;flex-wrap:wrap;gap:4px;min-height:40px}

.toolbar .run-btn{background:#0a5;border-color:#0a5;font-weight:bold}
.toolbar .logout-btn{background:#a00;border-color:#a00}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:768px){.main-area{flex-direction:row}}
.panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:120px}
.panel-header{padding:4px 8px;background:#1a1a1a;border-bottom:1px solid #333;font-size:10px;color:#888;flex-shrink:0}
#codeEditor{width:100%;height:100%;background:#0d0d0d;color:#0f0;border:none;padding:10px;font-family:monospace;font-size:13px;resize:none;outline:none;-webkit-appearance:none}

#previewContainer{display:none;height:100%;background:#fff}
#previewFrame{width:100%;height:100%;border:none;background:#fff}
