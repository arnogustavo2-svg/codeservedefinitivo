<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeCollab Pro</title>
    <meta name="theme-color" content="#0a0a0a">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#0a0a0a;color:#fff;height:100vh;width:100vw;overflow:hidden;position:fixed;top:0;left:0}
        #loginPage{display:flex;align-items:center;justify-content:center;height:100%;background:#0a0a0a}
        .login-card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:24px;width:90%;max-width:400px}
        .login-card h1{text-align:center;font-size:24px;margin-bottom:16px}
        .login-card input{width:100%;padding:10px;margin:6px 0;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:6px;font-size:14px}
        .login-card button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer}
        .btn-login{background:#fff;color:#000}
        .btn-register{background:transparent;border:1px solid #555;color:#fff}
        .error-msg{background:#400;color:#f66;padding:8px;border-radius:4px;font-size:12px;margin:8px 0;display:none}
        #editorPage{display:none;height:100%;flex-direction:column}
        .toolbar{display:flex;padding:8px;background:#1a1a1a;border-bottom:1px solid #333;gap:4px;flex-wrap:wrap;align-items:center}
        .toolbar button,.toolbar select{padding:6px 10px;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:4px;cursor:pointer;font-size:11px}
        .toolbar .run-btn{background:#0a5;border-color:#0a5;color:#fff;font-weight:bold}
        .toolbar .logout-btn{background:#a00;border-color:#a00}
        .main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
        @media(min-width:768px){.main-area{flex-direction:row}}
        .panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:200px}
        .panel-header{padding:4px 10px;background:#1a1a1a;font-size:11px;color:#888;border-bottom:1px solid #333}
        .panel-body{flex:1;overflow:hidden}
        #console{background:#0d0d0d;color:#0f0;font-family:monospace;font-size:12px;padding:10px;height:100%;overflow-y:auto;white-space:pre-wrap}
        #previewContainer{display:none;height:100%}
        #previewFrame{width:100%;height:100%;border:none;background:#fff}
        .splitter{width:100%;height:4px;background:#333;cursor:row-resize}
        @media(min-width:768px){.splitter{width:4px;height:auto;cursor:col-resize}}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center}
        .modal.show{display:flex}
        .modal-content{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto}
        .modal-content h3{margin-bottom:12px;font-size:18px}
        .modal-content button{width:100%;padding:10px;margin-top:10px;background:#333;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 20px;border-radius:20px;font-size:13px;font-family:monospace;z-index:200}
        .loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;align-items:center;justify-content:center}
        .loading.show{display:flex}
        .spinner{width:36px;height:36px;border:3px solid #333;border-top:3px solid #ccc;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .checkbox-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px;color:#999}
        .checkbox-row input[type="checkbox"]{width:18px;height:18px;cursor:pointer}
        .link{color:#4af;text-decoration:underline;cursor:pointer}
        .CodeMirror{height:100%!important;font-size:14px}
        textarea#codeEditor{display:none}
    </style>
</head>
<body>

    <div id="loginPage">
        <div class="login-card">
            <h1>🚀 CodeCollab Pro</h1>
            <p style="text-align:center;color:#888;font-size:11px;margin-bottom:16px;">HTML, JavaScript, Python e mais</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Senha">
            <div id="roomGroup" style="display:none"><input type="text" id="roomId" placeholder="ID da Sala"></div>
            <div class="checkbox-row"><input type="checkbox" id="joinRoomCheck"><span>Entrar em sala existente</span></div>
            <div class="checkbox-row"><input type="checkbox" id="lgpdCheck"><span>Aceito os <span class="link" id="termsLink">Termos</span> e <span class="link" id="lgpdLink">LGPD</span></span></div>
            <div class="error-msg" id="errorMsg"></div>
            <button class="btn-login" id="loginBtn">Entrar</button>
            <button class="btn-register" id="registerBtn">Criar Conta</button>
        </div>
    </div>

    <div id="editorPage">
        <div class="toolbar">
            <span style="font-weight:bold;color:#fff">🚀 CodeCollab</span>
            <span id="roomBadge" style="font-size:10px;color:#888;cursor:pointer">Sala: ---</span>
            <select id="langSelect"><option value="html">HTML</option><option value="javascript">JavaScript</option><option value="python">Python</option></select>
            <button class="run-btn" id="runBtn">▶ Run</button>
            <button id="downloadBtn">⬇ Baixar</button>
            <button id="fullscreenBtn">⛶ Tela Cheia</button>
            <button id="configBtn">⚙️</button>
            <button id="membersBtn">👥</button>
            <button class="logout-btn" id="logoutBtn">Sair</button>
        </div>
        <div class="main-area" id="mainArea">
            <div class="panel" id="editorPanel"><div class="panel-header">📝 Editor</div><div class="panel-body"><textarea id="codeEditor"></textarea></div></div>
            <div class="splitter" id="splitter"></div>
            <div class="panel" id="outputPanel"><div class="panel-header">💻 Console / Preview</div><div class="panel-body"><div id="console">// ▶ Run ou Ctrl+Enter</div><div id="previewContainer"><iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe></div></div></div>
        </div>
    </div>

    <div class="modal" id="configModal"><div class="modal-content"><h3>⚙️ Config</h3><select id="themeSelect" style="width:100%;padding:8px;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:4px;margin:8px 0"><option value="monokai">Monokai</option><option value="eclipse">Eclipse</option></select><label>Fonte: <span id="fontSizeVal">14px</span></label><input type="range" id="fontSizeSlider" min="10" max="24" value="14" style="width:100%;margin:8px 0"><div class="checkbox-row"><input type="checkbox" id="autosaveCheck" checked><span>Auto-save</span></div><button id="closeConfigBtn">Fechar</button></div></div>
    <div class="modal" id="membersModal"><div class="modal-content"><h3>👥 Membros</h3><div id="membersList"></div><button id="closeMembersBtn">Fechar</button></div></div>
    <div class="modal" id="legalModal"><div class="modal-content"><h3 id="legalTitle"></h3><div id="legalContent" style="font-size:13px;color:#999;line-height:1.6"></div><button id="closeLegalBtn">Fechar</button></div></div>
    <div class="modal" id="fullscreenModal"><div style="position:fixed;inset:0;background:#000;z-index:150;display:flex;flex-direction:column"><div style="padding:8px;background:#1a1a1a;display:flex;justify-content:space-between"><span style="color:#888">▶ Preview</span><button id="closeFullscreenBtn" style="background:#a00;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer">✕ Fechar</button></div><iframe id="fullscreenFrame" sandbox="allow-scripts allow-same-origin" style="flex:1;border:none;background:#fff"></iframe></div></div>
    <div class="loading" id="loadingOverlay"><div style="text-align:center"><div class="spinner"></div><span style="color:#ccc">Carregando...</span></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBXTrBywgR85BYs_7XRjf-N6leLTRTegis",
            authDomain: "codeverse-14794.firebaseapp.com",
            projectId: "codeverse-14794",
            storageBucket: "codeverse-14794.firebasestorage.app",
            messagingSenderId: "307083349125",
            appId: "1:307083349125:web:11b96a4c3fd856d6236dec"
        });
        
        var auth = firebase.auth();
        var db = firebase.firestore();
        
        var TMPL = {
            html: '<!DOCTYPE html>\n<html>\n<head><meta charset="UTF-8"><style>body{font-family:sans-serif;padding:20px;background:#f5f5f5}h1{color:#333}</style></head>\n<body><h1>🚀 Olá!</h1><p>Seu código aqui.</p></body>\n</html>',
            javascript: '// JavaScript\nconsole.log("Hello!");\n',
            python: '# Python\nprint("Hello!")\n'
        };
        
        var APP = {
            user: null, roomId: null, isOwner: false, editor: null,
            currentLang: 'html', fontSize: 14, autoSave: true,
            unsubscribe: null, previewUrl: null, syncTimer: null,
            
            init: function() {
                document.getElementById('loginPage').style.display = 'flex';
                document.getElementById('editorPage').style.display = 'none';
                
                var s = this;
                
                document.getElementById('loginBtn').onclick = function() { s.login(); };
                document.getElementById('registerBtn').onclick = function() { s.register(); };
                document.getElementById('logoutBtn').onclick = function() { s.logout(); };
                document.getElementById('runBtn').onclick = function() { s.runCode(); };
                document.getElementById('downloadBtn').onclick = function() { s.download(); };
                document.getElementById('fullscreenBtn').onclick = function() { s.fullscreen(); };
                document.getElementById('configBtn').onclick = function() { document.getElementById('configModal').classList.add('show'); };
                document.getElementById('membersBtn').onclick = function() { s.showMembers(); };
                document.getElementById('roomBadge').onclick = function() { s.copyLink(); };
                document.getElementById('closeConfigBtn').onclick = function() { document.getElementById('configModal').classList.remove('show'); };
                document.getElementById('closeMembersBtn').onclick = function() { document.getElementById('membersModal').classList.remove('show'); };
                document.getElementById('closeLegalBtn').onclick = function() { document.getElementById('legalModal').classList.remove('show'); };
                document.getElementById('closeFullscreenBtn').onclick = function() { document.getElementById('fullscreenModal').classList.remove('show'); };
                document.getElementById('termsLink').onclick = function() { s.showLegal('terms'); };
                document.getElementById('lgpdLink').onclick = function() { s.showLegal('lgpd'); };
                document.getElementById('joinRoomCheck').onchange = function() { document.getElementById('roomGroup').style.display = this.checked ? 'block' : 'none'; };
                document.getElementById('langSelect').onchange = function() { s.changeLanguage(this.value); };
                document.getElementById('themeSelect').onchange = function() { if (s.editor) s.editor.setOption('theme', this.value); };
                document.getElementById('fontSizeSlider').oninput = function() {
                    s.fontSize = parseInt(this.value);
                    document.getElementById('fontSizeVal').textContent = s.fontSize + 'px';
                    if (s.editor) { s.editor.getWrapperElement().style.fontSize = s.fontSize + 'px'; s.editor.refresh(); }
                };
                document.getElementById('autosaveCheck').onchange = function() { s.autoSave = this.checked; };
                
                document.querySelectorAll('.modal').forEach(function(m) { m.onclick = function(e) { if (e.target === m) m.classList.remove('show'); }; });
                
                document.onkeydown = function(e) {
                    if (e.key === 'Escape') document.querySelectorAll('.modal.show').forEach(function(m) { m.classList.remove('show'); });
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); s.runCode(); }
                };
                
                this.setupSplitter();
                
                auth.onAuthStateChanged(function(user) {
                    if (user) { s.user = user; var p = new URLSearchParams(location.search); var r = p.get('room'); if (r) s.joinRoom(r); }
                });
            },
            
            login: function() {
                if (!document.getElementById('lgpdCheck').checked) { this.showError('Aceite os Termos e LGPD.'); return; }
                var email = document.getElementById('email').value.trim();
                var pass = document.getElementById('password').value;
                if (!email || !pass) { this.showError('Preencha os campos.'); return; }
                this.showLoading(true);
                var s = this;
                auth.signInWithEmailAndPassword(email, pass).then(function(r) {
                    s.user = r.user;
                    if (document.getElementById('joinRoomCheck').checked && document.getElementById('roomId').value.trim()) return s.joinRoom(document.getElementById('roomId').value.trim());
                    return s.createRoom();
                }).catch(function(e) { s.showError(s.translateError(e)); }).finally(function() { s.showLoading(false); });
            },
            
            register: function() {
                if (!document.getElementById('lgpdCheck').checked) { this.showError('Aceite os Termos e LGPD.'); return; }
                var email = document.getElementById('email').value.trim();
                var pass = document.getElementById('password').value;
                if (!email || !pass) { this.showError('Preencha os campos.'); return; }
                if (pass.length < 6) { this.showError('Senha: mínimo 6.'); return; }
                this.showLoading(true);
                var s = this;
                auth.createUserWithEmailAndPassword(email, pass).then(function(r) { s.user = r.user; return s.createRoom(); }).catch(function(e) { s.showError(s.translateError(e)); }).finally(function() { s.showLoading(false); });
            },
            
            logout: function() {
                this.showLoading(true);
                var s = this;
                if (this.unsubscribe) { this.unsubscribe(); this.unsubscribe = null; }
                if (this.editor) { this.editor.toTextArea(); this.editor = null; }
                if (this.previewUrl) { URL.revokeObjectURL(this.previewUrl); this.previewUrl = null; }
                auth.signOut().then(function() {
                    s.user = null; s.roomId = null; s.isOwner = false;
                    history.pushState({}, '', location.pathname);
                    document.getElementById('loginPage').style.display = 'flex';
                    document.getElementById('editorPage').style.display = 'none';
                    s.showLoading(false);
                });
            },
            
            createRoom: function() {
                var s = this;
                return db.collection('rooms').add({
                    ownerId: this.user.uid, ownerEmail: this.user.email,
                    members: [this.user.uid], memberEmails: {},
                    code: TMPL[this.currentLang] || '', language: this.currentLang,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(function(doc) {
                    s.roomId = doc.id; s.isOwner = true;
                    history.pushState({}, '', '?room=' + doc.id);
                    s.showEditor(); s.toast('✅ Sala criada!');
                }).catch(function() { s.showError('Erro ao criar sala.'); });
            },
            
            joinRoom: function(id) {
                var s = this;
                return db.collection('rooms').doc(id).get().then(function(doc) {
                    if (!doc.exists) { s.showError('Não encontrada.'); throw new Error('nf'); }
                    var d = doc.data();
                    if (!d.members.includes(s.user.uid)) {
                        var u = { members: firebase.firestore.FieldValue.arrayUnion(s.user.uid) };
                        u['memberEmails.' + s.user.uid] = s.user.email;
                        return db.collection('rooms').doc(id).update(u).then(function() { return d; });
                    }
                    return d;
                }).then(function(d) {
                    if (!d) return;
                    s.roomId = id; s.isOwner = d.ownerId === s.user.uid;
                    if (d.language) { s.currentLang = d.language; document.getElementById('langSelect').value = d.language; }
                    history.pushState({}, '', '?room=' + id);
                    s.showEditor(); s.toast('✅ Entrou!');
                }).catch(function(e) { if (e.message !== 'nf') s.showError('Erro.'); });
            },
            
            showEditor: function() {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('editorPage').style.display = 'flex';
                document.getElementById('roomBadge').textContent = 'Sala: ' + (this.roomId ? this.roomId.substring(0, 10) + '...' : '---');
                var s = this;
                if (!this.editor) {
                    setTimeout(function() {
                        s.editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
                            mode: 'htmlmixed', theme: 'monokai', lineNumbers: true,
                            lineWrapping: true, autoCloseTags: true, autoCloseBrackets: true,
                            indentUnit: 2, tabSize: 2
                        });
                        s.editor.on('change', function() {
                            if (s.currentLang === 'html') s.updatePreview(s.editor.getValue());
                            if (s.autoSave && s.roomId) { clearTimeout(s.syncTimer); s.syncTimer = setTimeout(function() { s.syncCode(); }, 500); }
                        });
                        s.editor.getWrapperElement().style.fontSize = s.fontSize + 'px';
                        if (s.roomId) s.listenRoom();
                    }, 200);
                } else { if (s.roomId) s.listenRoom(); }
            },
            
            listenRoom: function() {
                var s = this;
                if (this.unsubscribe) this.unsubscribe();
                this.unsubscribe = db.collection('rooms').doc(this.roomId).onSnapshot(function(doc) {
                    if (!doc.exists) { s.logout(); return; }
                    var d = doc.data();
                    if (!d.members.includes(s.user.uid)) { alert('Removido.'); s.logout(); return; }
                    if (s.editor && d.code !== s.editor.getValue()) { var c = s.editor.getCursor(); s.editor.setValue(d.code || ''); s.editor.setCursor(c); }
                    if (d.language && d.language !== s.currentLang) { s.currentLang = d.language; document.getElementById('langSelect').value = d.language; s.changeLanguage(d.language); }
                });
            },
            
            syncCode: function() { if (!this.roomId || !this.editor) return; db.collection('rooms').doc(this.roomId).update({ code: this.editor.getValue(), language: this.currentLang }).catch(function() {}); },
            
            changeLanguage: function(lang) {
                this.currentLang = lang;
                var m = { html:'htmlmixed', javascript:'javascript', python:'python' };
                if (this.editor) { this.editor.setOption('mode', m[lang] || 'javascript'); if (!this.editor.getValue().trim()) this.editor.setValue(TMPL[lang] || ''); }
                if (lang === 'html') { document.getElementById('previewContainer').style.display = 'block'; document.getElementById('console').style.display = 'none'; if (this.editor) this.updatePreview(this.editor.getValue()); }
                else { document.getElementById('previewContainer').style.display = 'none'; document.getElementById('console').style.display = 'block'; }
                this.toast('📝 ' + lang);
            },
            
            updatePreview: function(code) { if (this.previewUrl) URL.revokeObjectURL(this.previewUrl); this.previewUrl = URL.createObjectURL(new Blob([code], { type: 'text/html' })); document.getElementById('previewFrame').src = this.previewUrl; },
            
            runCode: function() {
                if (!this.editor) { this.toast('⚠️ Aguarde...'); return; }
                var code = this.editor.getValue();
                if (this.currentLang === 'html') { this.updatePreview(code); document.getElementById('previewContainer').style.display = 'block'; document.getElementById('console').style.display = 'none'; return; }
                document.getElementById('console').style.display = 'block'; document.getElementById('previewContainer').style.display = 'none';
                var c = document.getElementById('console'); c.className = ''; c.textContent = '⏳ Executando...\n';
                if (this.currentLang === 'javascript') {
                    try { var out = ''; var ol = console.log; console.log = function() { for (var i=0; i<arguments.length; i++) out += arguments[i] + ' '; out += '\n'; }; eval(code); console.log = ol; c.textContent = out || '✅ OK'; }
                    catch(e) { c.textContent = '❌ ' + e.message; c.className = 'error'; }
                } else { c.textContent = '⚠️ Use HTML ou JS.'; c.className = 'warn'; }
            },
            
            download: function() {
                if (!this.editor) return;
                var e = { html:'.html', javascript:'.js', python:'.py' };
                var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([this.editor.getValue()], { type:'text/plain' })); a.download = 'projeto' + (e[this.currentLang] || '.txt'); a.click(); this.toast('✅ Baixado!');
            },
            
            fullscreen: function() { if (!this.editor) return; var b = new Blob([this.editor.getValue()], { type:'text/html' }); document.getElementById('fullscreenFrame').src = URL.createObjectURL(b); document.getElementById('fullscreenModal').classList.add('show'); },
            
            copyLink: function() {
                if (!this.roomId) return;
                var url = location.origin + location.pathname + '?room=' + this.roomId;
                if (navigator.clipboard) { navigator.clipboard.writeText(url).then(function() { APP.toast('✅ Copiado!'); }); }
                else { var t = document.createElement('textarea'); t.value = url; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); APP.toast('✅ Copiado!'); }
            },
            
            showMembers: function() {
                if (!this.roomId) return;
                var s = this;
                db.collection('rooms').doc(this.roomId).get().then(function(doc) {
                    var d = doc.data(), list = document.getElementById('membersList'); list.innerHTML = '';
                    var od = document.createElement('div'); od.style.cssText = 'padding:8px;background:#222;border-radius:4px;margin:4px 0;font-size:12px'; od.innerHTML = '👑 <b>' + d.ownerEmail + '</b> (Dono)'; list.appendChild(od);
                    var me = d.memberEmails || {};
                    d.members.forEach(function(uid) {
                        if (uid !== d.ownerId) { var dd = document.createElement('div'); dd.style.cssText = 'padding:8px;background:#111;border-radius:4px;margin:4px 0;font-size:12px;display:flex;justify-content:space-between'; dd.innerHTML = '<span>👤 ' + (me[uid] || uid.substring(0,8)+'...') + '</span>' + (s.isOwner ? '<button onclick="APP.removeMember(\''+uid+'\')" style="background:#a00;color:#fff;border:none;padding:2px 8px;border-radius:3px;cursor:pointer">Remover</button>' : ''); list.appendChild(dd); }
                    });
                    document.getElementById('membersModal').classList.add('show');
                });
            },
            
            removeMember: function(uid) {
                if (!this.isOwner || !confirm('Remover?')) return;
                var s = this, u = { members: firebase.firestore.FieldValue.arrayRemove(uid) };
                u['memberEmails.' + uid] = firebase.firestore.FieldValue.delete();
                db.collection('rooms').doc(this.roomId).update(u).then(function() { s.toast('✅ Removido!'); s.showMembers(); });
            },
            
            showLegal: function(type) {
                var t = document.getElementById('legalTitle'), c = document.getElementById('legalContent');
                if (type === 'terms') { t.textContent = '📋 Termos'; c.innerHTML = '<p><b style="color:#fff">1.</b> Ao usar, concorda.</p><p style="margin-top:8px"><b style="color:#fff">2.</b> Suporte multilinguagem.</p>'; }
                else { t.textContent = '🔒 LGPD'; c.innerHTML = '<p><b style="color:#fff">1.</b> Coletamos email e código.</p><p style="margin-top:8px"><b style="color:#fff">2.</b> Dados protegidos.</p>'; }
                document.getElementById('legalModal').classList.add('show');
            },
            
            setupSplitter: function() {
                var sp = document.getElementById('splitter'), ep = document.getElementById('editorPanel'), op = document.getElementById('outputPanel'), ma = document.getElementById('mainArea'), dragging = false;
                function im() { return window.innerWidth < 768; }
                sp.addEventListener('mousedown', function() { dragging = true; });
                sp.addEventListener('touchstart', function() { dragging = true; }, { passive: true });
                document.addEventListener('mousemove', function(e) {
                    if (!dragging) return; var r = ma.getBoundingClientRect();
                    if (im()) { var p = ((e.clientY - r.top) / r.height) * 100, v = Math.max(15, Math.min(85, p)); ep.style.flex = 'none'; ep.style.height = v + '%'; op.style.flex = 'none'; op.style.height = (100-v) + '%'; }
                    else { var p = ((e.clientX - r.left) / r.width) * 100, v = Math.max(15, Math.min(85, p)); ep.style.flex = 'none'; ep.style.width = v + '%'; op.style.flex = 'none'; op.style.width = (100-v) + '%'; }
                    if (APP.editor) APP.editor.refresh();
                });
                document.addEventListener('touchmove', function(e) { if (!dragging) return; var r = ma.getBoundingClientRect(), p = ((e.touches[0].clientY - r.top) / r.height) * 100, v = Math.max(15, Math.min(85, p)); ep.style.flex = 'none'; ep.style.height = v + '%'; op.style.flex = 'none'; op.style.height = (100-v) + '%'; }, { passive: true });
                document.addEventListener('mouseup', function() { dragging = false; });
                document.addEventListener('touchend', function() { dragging = false; });
            },
            
            showError: function(msg) { var e = document.getElementById('errorMsg'); e.textContent = msg; e.style.display = 'block'; },
            toast: function(msg) { var x = document.querySelector('.toast'); if (x) x.remove(); var e = document.createElement('div'); e.className = 'toast'; e.textContent = msg; document.body.appendChild(e); setTimeout(function() { e.style.opacity = '0'; e.style.transition = 'opacity 0.3s'; setTimeout(function() { if (e.parentNode) e.remove(); }, 300); }, 2500); },
            showLoading: function(s) { document.getElementById('loadingOverlay').classList.toggle('show', s); },
            translateError: function(e) { var m = { 'auth/email-already-in-use': 'Email já cadastrado.', 'auth/invalid-email': 'Email inválido.', 'auth/weak-password': 'Senha fraca.', 'auth/user-not-found': 'Usuário não encontrado.', 'auth/wrong-password': 'Senha incorreta.', 'auth/too-many-requests': 'Muitas tentativas.', 'auth/network-request-failed': 'Sem conexão.', 'auth/operation-not-allowed': 'Login desabilitado no Firebase.' }; return m[e.code] || e.message; }
        };
        
        window.APP = APP;
        APP.init();
    </script>
</body>
</html>
